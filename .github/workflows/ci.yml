name: Checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/api/requirements.txt}
      - run: pip install -r services/api/requirements.txt
      - run: python -m pytest tests/ -q
      - run: python scripts/verify_pilot.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/web
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-key-at-least-thirty-two-characters
          ADMIN_PASSWORD: ci-only-admin-password
      - run: docker build -f services/api/Dockerfile -t pustaka-api .
      - run: docker build -f apps/web/Dockerfile -t pustaka-web .
