services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pustaka
      POSTGRES_USER: pustaka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pustaka -d pustaka']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: .., dockerfile: services/api/Dockerfile}
    environment: &backend
      DATABASE_URL: postgresql+psycopg://pustaka:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/pustaka
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://pustaka-ilmu.pages.dev}
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: 'false'
      AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      BACKUP_DIR: /data/backups
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m app.migrate
  api:
    build: {context: .., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    environment: *backend
    ports: ['127.0.0.1:8000:8000']
    volumes: [backups:/data/backups]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 20s
      timeout: 5s
      retries: 3
  worker:
    build: {context: .., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    environment: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: [backups:/data/backups]
    command: python -m celery -A workers.celery_app worker --loglevel=info --concurrency=2
  scheduler:
    build: {context: .., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    environment: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: python -m celery -A workers.celery_app beat --loglevel=info
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
volumes:
  pgdata: {}
  redisdata: {}
  backups: {}
